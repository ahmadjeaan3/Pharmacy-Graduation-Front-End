name: pharmacy-platform

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in docker/.env}
    volumes:
      - pharmacy_sql_data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  smart-ai:
    build:
      context: ../../AI
      dockerfile: Dockerfile
    env_file:
      - ../../AI/.env
    environment:
      APP_API_KEY: ${AI_SHARED_API_KEY:?Set AI_SHARED_API_KEY in docker/.env}
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - smart_ai_cache:/app/.model_cache
    expose:
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  drug-search:
    build:
      context: ../../AI/drug_search_api_out
      dockerfile: Dockerfile
    environment:
      APP_API_KEY: ${AI_SHARED_API_KEY:?Set AI_SHARED_API_KEY in docker/.env}
    expose:
      - "8002"
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  license-ai:
    build:
      context: ../../AI/license_ai_service
      dockerfile: Dockerfile
    env_file:
      - ../../AI/license_ai_service/.env
    environment:
      SERVICE_API_KEY: ${LICENSE_AI_API_KEY:?Set LICENSE_AI_API_KEY in docker/.env}
    expose:
      - "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  backend:
    build:
      context: ../../PharmacyGRA_1/PharmacyGRA_1
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=database,1433;Database=PharmacyGRA_DB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in docker/.env}
      AdminAccount__Enabled: "true"
      AdminAccount__Email: ${ADMIN_EMAIL:-admin@pharmacy.local}
      AdminAccount__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in docker/.env}
      SmartPharmacyBot__Enabled: "true"
      SmartPharmacyBot__BaseUrl: http://smart-ai:8000
      SmartPharmacyBot__ApiKey: ${AI_SHARED_API_KEY}
      LicenseAiService__Enabled: "true"
      LicenseAiService__BaseUrl: http://license-ai:8001
      LicenseAiService__ApiKey: ${LICENSE_AI_API_KEY}
      DrugSearchService__Enabled: "true"
      DrugSearchService__BaseUrl: http://drug-search:8002
      DrugSearchService__ApiKey: ${AI_SHARED_API_KEY}
      GooglePlaces__ApiKey: ${GOOGLE_PLACES_API_KEY:-}
      Cors__AllowedOrigins__0: http://localhost:8088
    depends_on:
      database:
        condition: service_healthy
      smart-ai:
        condition: service_healthy
      drug-search:
        condition: service_healthy
      license-ai:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - backend_app_data:/app/App_Data
    ports:
      - "${BACKEND_PORT:-5031}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  pharmacy_sql_data:
  smart_ai_cache:
  backend_app_data:
