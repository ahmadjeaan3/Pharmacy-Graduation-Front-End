<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b4a55"/>
      <stop offset="1" stop-color="#147985"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#07333b" flood-opacity=".13"/>
    </filter>
    <style>
      .ar { font-family: Tahoma, Arial, sans-serif; direction: rtl; unicode-bidi: plaintext; }
      .math { font-family: Arial, sans-serif; direction: ltr; unicode-bidi: embed; }
      .ink { fill: #12343b; }
      .muted { fill: #5d777d; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f4f8f8"/>
  <rect width="1600" height="145" fill="url(#header)"/>
  <circle cx="120" cy="72" r="43" fill="#ffffff" opacity=".12"/>
  <path d="M95 72h50M120 47v50" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".9"/>
  <text x="800" y="67" text-anchor="middle" class="ar" fill="#fff" font-size="49" font-weight="700">معادلة توقّع نفاد الدواء</text>
  <text x="800" y="112" text-anchor="middle" class="ar" fill="#d9f0ef" font-size="25">متوسط موزون يجمع الاستقرار التاريخي مع حركة المبيعات الحديثة</text>

  <rect x="70" y="175" width="1460" height="115" rx="26" fill="#fff" stroke="#c8dfe1" filter="url(#shadow)"/>
  <text x="800" y="250" text-anchor="middle" class="math ink" font-size="57" font-weight="700">D = 0.45A + 0.35W + 0.20M</text>

  <g filter="url(#shadow)">
    <rect x="70" y="325" width="345" height="145" rx="22" fill="#fff" stroke="#c8dfe1"/>
    <rect x="435" y="325" width="345" height="145" rx="22" fill="#fff" stroke="#b8e1d6"/>
    <rect x="800" y="325" width="345" height="145" rx="22" fill="#fffdf7" stroke="#ead28a"/>
    <rect x="1165" y="325" width="365" height="145" rx="22" fill="#fff" stroke="#c8dfe1"/>
  </g>
  <text x="242" y="372" text-anchor="middle" class="math" fill="#0e5964" font-size="35" font-weight="700">D</text>
  <text x="242" y="415" text-anchor="middle" class="ar ink" font-size="24" font-weight="700">معدل الطلب اليومي المتوقع</text>
  <text x="607" y="372" text-anchor="middle" class="math" fill="#138a72" font-size="35" font-weight="700">A</text>
  <text x="607" y="415" text-anchor="middle" class="ar ink" font-size="24" font-weight="700">متوسط الاستهلاك اليومي</text>
  <text x="972" y="372" text-anchor="middle" class="math" fill="#b37b00" font-size="35" font-weight="700">W</text>
  <text x="972" y="410" text-anchor="middle" class="ar ink" font-size="23" font-weight="700">مبيعات آخر 7 أيام ÷ 7</text>
  <text x="1347" y="372" text-anchor="middle" class="math" fill="#0e5964" font-size="35" font-weight="700">M</text>
  <text x="1347" y="410" text-anchor="middle" class="ar ink" font-size="23" font-weight="700">مبيعات آخر 30 يوماً ÷ 30</text>

  <rect x="70" y="495" width="1460" height="65" rx="17" fill="#e8f4f3"/>
  <text x="1320" y="537" text-anchor="middle" class="ar" fill="#0e5964" font-size="25" font-weight="700">45% للاستقرار الأساسي</text>
  <text x="800" y="537" text-anchor="middle" class="ar" fill="#138a72" font-size="25" font-weight="700">35% لالتقاط التغيّر الحديث</text>
  <text x="280" y="537" text-anchor="middle" class="ar" fill="#9b6900" font-size="25" font-weight="700">20% لتخفيف التقلبات المؤقتة</text>

  <text x="800" y="622" text-anchor="middle" class="ar ink" font-size="35" font-weight="700">مثال رقمي واضح</text>
  <line x1="70" y1="640" x2="1530" y2="640" stroke="#c8dfe1" stroke-width="2"/>
  <text x="800" y="686" text-anchor="middle" class="math ink" font-size="29" font-weight="700">A = 4   |   W = 35 ÷ 7 = 5   |   M = 120 ÷ 30 = 4</text>
  <text x="800" y="738" text-anchor="middle" class="math ink" font-size="30" font-weight="700">D = (0.45 × 4) + (0.35 × 5) + (0.20 × 4)</text>
  <text x="800" y="790" text-anchor="middle" class="math" fill="#08765f" font-size="32" font-weight="700">D = 1.80 + 1.75 + 0.80 = 4.35</text>
  <text x="1100" y="790" text-anchor="start" class="ar" fill="#08765f" font-size="24" font-weight="700">عبوة/يوم</text>

  <rect x="70" y="815" width="1460" height="64" rx="18" fill="#fff2c9" stroke="#d5a021" stroke-width="2"/>
  <text x="800" y="856" text-anchor="middle" class="ar ink" font-size="27" font-weight="700">مخزون 100 عبوة ÷ طلب 4.35 يومياً ≈ 23 يوماً حتى النفاد — مستوى الخطورة: متوسط</text>
</svg>
